<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>muara.bi · M0 spike</title>
<style>
  :root {
    --bg: #faf9f7; --card: #ffffff; --line: #e6e2dc; --ink: #1f1d1a; --muted: #6f6a63; --accent: #1f6f5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px; background: var(--bg); color: var(--ink);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none;
  }
  h1 { font-size: 15px; margin: 0 0 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .stats div span { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 7px 12px;
    font: inherit; cursor: pointer;
  }
  button.ghost { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
  textarea {
    width: 100%; min-height: 74px; padding: 8px; border: 1px solid var(--line); border-radius: 8px;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink); background: var(--card);
  }
  table { border-collapse: collapse; width: 100%; }
  th, td { border-bottom: 1px solid var(--line); padding: 5px 8px; text-align: left; white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .wrap { overflow: auto; max-height: 320px; }
  #status.err, #result.err { color: #a3322a; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #fdf0d8; color: #7a5310; }
</style>
</head>
<body>
<h1>M0 spike — Wails v3 × DuckDB engine</h1>

<div class="stats card" id="stats">Loading engine settings…</div>

<div class="row">
  <button id="attach">Attach Postgres sample</button>
  <button class="ghost" id="run">Jalankan query</button>
  <span id="status"></span>
</div>

<textarea id="sql">SELECT o.channel, COUNT(*) AS orders, SUM(o.total) AS revenue
FROM sample.public.orders AS o
GROUP BY 1 ORDER BY revenue DESC</textarea>

<div class="card wrap" id="result" style="margin-top:12px">Belum ada hasil.</div>

<script type="module">
import { QueryService } from "./bindings/muara.bi/desktop/index.js";

const stats = document.getElementById("stats");
const status = document.getElementById("status");
const result = document.getElementById("result");

function setText(el, text, isError) {
  el.textContent = text;
  el.classList.toggle("err", !!isError);
}

async function refreshStatus() {
  try {
    const s = await QueryService.Status();
    stats.innerHTML = "";
    const cells = [
      ["DuckDB", s.duckdbVersion],
      ["max_memory", s.maxMemory],
      ["threads", s.threads],
      ["extension_directory", s.extensionDirectory || "(duckdb default)"],
      ["temp_directory", s.tempDirectory],
    ];
    for (const [label, value] of cells) {
      const box = document.createElement("div");
      const cap = document.createElement("span");
      cap.textContent = label;
      box.appendChild(cap);
      box.appendChild(document.createTextNode(String(value)));
      stats.appendChild(box);
    }
    setText(status, "");
  } catch (err) {
    setText(stats, "Engine gagal start: " + err, true);
  }
}

document.getElementById("attach").addEventListener("click", async () => {
  try {
    await QueryService.AttachSample();
    setText(status, "sample ter-attach (READ_ONLY)");
  } catch (err) {
    setText(status, String(err), true);
  }
});

document.getElementById("run").addEventListener("click", async () => {
  const sql = document.getElementById("sql").value;
  try {
    const res = await QueryService.Run(sql);
    render(res);
  } catch (err) {
    setText(result, String(err), true);
  }
});

function render(res) {
  const table = document.createElement("table");
  const head = document.createElement("tr");
  for (const col of res.columns) {
    const th = document.createElement("th");
    th.textContent = `${col.name} · ${col.type}`;
    head.appendChild(th);
  }
  table.appendChild(head);
  for (const row of res.rows) {
    const tr = document.createElement("tr");
    for (const col of res.columns) {
      const td = document.createElement("td");
      td.textContent = row[col.name] === null ? "—" : String(row[col.name]);
      tr.appendChild(td);
    }
    table.appendChild(tr);
  }
  result.innerHTML = "";
  result.appendChild(table);
  if (res.truncated) {
    const badge = document.createElement("div");
    badge.className = "badge";
    badge.textContent = `terpotong oleh ${res.truncated_by} · cap ${res.row_limit}`;
    result.appendChild(badge);
  }
  setText(status, `${res.row_count} baris · ${res.duration_ms} ms`);
}

document.addEventListener("DOMContentLoaded", refreshStatus);
</script>
</body>
</html>
